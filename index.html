<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiFacturaDigital.com.ve - POS y Facturación Fiscal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-emerald-400">MiFacturaDigital</h1>
            <p class="text-xs text-slate-400">Facturación ágil bajo Providencia SENIAT</p>
        </header>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Tasa BCV del Día (Bs.)</label>
                <input type="number" id="tasaBcv" step="0.0001" value="36.5000" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Monto Total en Divisas ($ USD)</label>
                <input type="number" id="montoUsd" step="0.01" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-emerald-500" oninput="calcularImpuestos()">
            </div>

            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 space-y-2 text-sm">
                <div class="flex justify-between text-slate-300">
                    <span>Subtotal Bs:</span>
                    <span id="subtotalBs" class="font-mono">Bs. 0,00</span>
                </div>
                <div class="flex justify-between text-slate-300">
                    <span>IVA (16%):</span>
                    <span id="ivaBs" class="font-mono">Bs. 0,00</span>
                </div>
                <div class="flex justify-between text-slate-300">
                    <span>IGTF (3% Divisas):</span>
                    <span id="igtfBs" class="font-mono">Bs. 0,00</span>
                </div>
                <div class="border-t border-slate-700 pt-2 flex justify-between font-bold text-emerald-400 text-base">
                    <span>Total a Pagar:</span>
                    <span id="totalBs" class="font-mono">Bs. 0,00</span>
                </div>
            </div>

            <button onclick="emitirFactura()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-emerald-900/20">
                Emitir Factura Digital
            </button>
        </div>
    </div>

    <footer class="text-xs text-slate-500 text-center mt-4">
        MiFacturaDigital.com.ve &copy; 2026 - Zero-Migration Architecture
    </footer>

    <script>
        function calcularImpuestos() {
            const tasa = parseFloat(document.getElementById('tasaBcv').value) || 0;
            const usd = parseFloat(document.getElementById('montoUsd').value) || 0;
            
            const subtotalBs = usd * tasa;
            const ivaBs = subtotalBs * 0.16;
            const igtfBs = subtotalBs * 0.03;
            const totalBs = subtotalBs + ivaBs + igtfBs;

            document.getElementById('subtotalBs').innerText = 'Bs. ' + subtotalBs.toLocaleString('es-VE', {minimumFractionDigits: 2});
            document.getElementById('ivaBs').innerText = 'Bs. ' + ivaBs.toLocaleString('es-VE', {minimumFractionDigits: 2});
            document.getElementById('igtfBs').innerText = 'Bs. ' + igtfBs.toLocaleString('es-VE', {minimumFractionDigits: 2});
            document.getElementById('totalBs').innerText = 'Bs. ' + totalBs.toLocaleString('es-VE', {minimumFractionDigits: 2});
        }

        function emitirFactura() {
            alert('¡Módulo de prueba configurado! Próximamente integrado directamente con Supabase.');
        }
    </script>
</body>
</html>
