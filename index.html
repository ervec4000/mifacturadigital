<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiFacturaDigital.com.ve - Sistema Fiscal Integrado SENIAT Enterprise 2026</title>

  <!-- Librerías Externas -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    @media print {
      body * { visibility: hidden; }
      #seccionFisico, #seccionFisico *, #modalTicket, #modalTicket * { visibility: visible; }
      #seccionFisico, #modalTicket { position: absolute; left: 0; top: 0; width: 100%; background: white; color: black; }
      .no-print { display: none !important; }
    }
    .tech-pattern {
      background-image: radial-gradient(rgba(16, 185, 129, 0.12) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .whatsapp-pulse { animation: pulse-slow 3s infinite; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans tech-pattern relative">

  <!-- CONTENEDOR VISTA LANDING / LOGIN -->
  <div id="vistaLanding" class="w-full min-h-screen">
    <!-- Generado dinámicamente desde /js/landing.js -->
  </div>

  <!-- MODAL / CONTENEDOR DE LOGIN -->
  <div id="vistaLogin" class="hidden fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 rounded-3xl shadow-2xl p-8 border border-slate-800 space-y-6 relative">
      <button onclick="ocultarLogin()" class="absolute top-5 right-5 text-slate-400 hover:text-white text-xl font-bold cursor-pointer">✕</button>
      <header class="text-center space-y-2">
        <div class="inline-block p-3 bg-emerald-600/20 border border-emerald-500/40 rounded-2xl text-emerald-400 font-mono text-xs font-bold">
          ENTERPRISE CLOUD V2026
        </div>
        <h2 class="text-2xl font-bold text-white tracking-wide">MiFacturaDigital</h2>
        <p class="text-xs text-slate-400">Acceso al Sistema Fiscal Integrado SENIAT</p>
      </header>
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Correo Electrónico (Tenant)</label>
          <input type="email" id="loginEmail" placeholder="ejemplo@correo.com" autocomplete="off" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm font-mono focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Contraseña</label>
          <input type="password" id="loginPassword" placeholder="••••••" autocomplete="new-password" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm font-mono focus:border-emerald-500">
        </div>
        <button onclick="iniciarSesionTenant()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl transition duration-200 shadow-lg shadow-emerald-900/30 cursor-pointer text-sm">
          Iniciar Sesión
        </button>
      </div>
    </div>
  </div>

  <!-- VISTA PRINCIPAL (POST-LOGIN) -->
  <div id="vistaPrincipal" class="hidden w-full max-w-7xl mx-auto bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 my-6 flex flex-col min-h-[90vh]">
    <!-- Header Shell Bar -->
    <header class="bg-slate-950 border-b border-slate-800 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 rounded-t-2xl">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-600/20 border border-emerald-500 flex items-center justify-center text-emerald-400 font-mono font-bold text-sm shadow">⚡</div>
        <div>
          <h1 class="text-base font-bold text-white flex items-center gap-2">
            <span id="headerTenantNombre">Comercio Activo</span>
            <span id="headerTenantPlan" class="text-[10px] bg-emerald-900/50 border border-emerald-700 text-emerald-300 px-2 py-0.5 rounded font-mono uppercase">Freemium</span>
          </h1>
          <p class="text-xs text-slate-400 font-mono">RIF: <span id="headerTenantRif">J-00000000-0</span> | Rol: <span id="headerTenantRol" class="text-amber-400 font-bold uppercase">--</span></p>
        </div>
      </div>
      <div class="flex items-center gap-3 flex-wrap">
        <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 p-1.5 rounded-xl">
          <button onclick="abrirModalPerfil()" class="hover:bg-slate-800 text-slate-300 hover:text-white text-xs px-2.5 py-1 rounded-lg transition cursor-pointer flex items-center gap-1.5">⚙️ Perfil</button>
          <button onclick="cerrarSesion()" class="hover:bg-rose-950 text-rose-400 text-xs px-2.5 py-1 rounded-lg font-semibold transition cursor-pointer">🚪 Salir</button>
        </div>
      </div>
    </header>

    <!-- Navegación por Pestañas Organizada -->
    <nav class="bg-slate-950/60 border-b border-slate-800 px-6 py-2.5 flex flex-wrap gap-2">
      <button onclick="cambiarPestana('pos')" id="btnTabPos" class="bg-emerald-600 text-white px-3 py-2 rounded-xl font-semibold text-xs transition cursor-pointer shadow-md flex items-center gap-1.5">🛒 [POS] Ventas</button>
      <button onclick="cambiarPestana('historial')" id="btnTabHistorial" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl font-semibold text-xs transition cursor-pointer flex items-center gap-1.5">📋 [SEN] Comprobantes</button>
      <button onclick="cambiarPestana('cierrez')" id="btnTabCierrez" class="tab-admin bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl font-semibold text-xs transition cursor-pointer flex items-center gap-1.5">📊 [CIE] Reporte Z & Libros</button>
      <button onclick="cambiarPestana('compras')" id="btnTabCompras" class="tab-admin bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl font-semibold text-xs transition cursor-pointer flex items-center gap-1.5">📥 [COM] Compras</button>
      <button onclick="cambiarPestana('kardex')" id="btnTabKardex" class="tab-admin bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl font-semibold text-xs transition cursor-pointer flex items-center gap-1.5">📦 [INV] Kardex PPM</button>
      <button onclick="cambiarPestana('fisico')" id="btnTabFisico" class="tab-admin bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl font-semibold text-xs transition cursor-pointer flex items-center gap-1.5">🔍 [INV] Inv. Físico</button>
      <button onclick="cambiarPestana('productos')" id="btnTabProductos" class="tab-admin bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl font-semibold text-xs transition cursor-pointer flex items-center gap-1.5">🏷️ [CAT] Artículos</button>
      <button onclick="cambiarPestana('clientes')" id="btnTabClientes" class="tab-admin bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-xl font-semibold text-xs transition cursor-pointer flex items-center gap-1.5">👥 [CAT] Clientes</button>
      <button onclick="cambiarPestana('inquilinosMaster')" id="btnTabInquilinosMaster" class="tab-master hidden bg-emerald-950 border border-emerald-700 text-emerald-300 px-3 py-2 rounded-xl font-semibold text-xs cursor-pointer">🏢 Master</button>
    </nav>

    <!-- CONTENEDOR DE SECCIONES INTERNAS -->
    <main class="p-6 flex-1 space-y-6">
      <div id="seccionPos" class="space-y-6"></div>
      <div id="seccionHistorial" class="hidden space-y-6"></div>
      <div id="seccionCierrez" class="hidden space-y-6"></div>
      <div id="seccionCompras" class="hidden space-y-6"></div>
      <div id="seccionKardex" class="hidden space-y-6"></div>
      <div id="seccionFisico" class="hidden space-y-6"></div>
      <div id="seccionProductos" class="hidden space-y-6"></div>
      <div id="seccionClientes" class="hidden space-y-6"></div>
      <div id="seccionInquilinosMaster" class="hidden space-y-6"></div>
    </main>
  </div>

  <!-- INICIALIZADOR SUPABASE GLOBAL -->
  <script>
    const SUPABASE_URL = 'https://pursobbuinxbbmkipivu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_78guLKFnFoK_RBIprxxl1w_CF-G0zji';
    let supabaseClient = null;

    window.onload = function() {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        if (typeof verificarSesionGuardada === 'function') verificarSesionGuardada();
      }
    };

    function mostrarLogin() {
      const modal = document.getElementById('vistaLogin');
      if (modal) modal.classList.remove('hidden');
    }

    function ocultarLogin() {
      const modal = document.getElementById('vistaLogin');
      if (modal) modal.classList.add('hidden');
    }
  </script>

  <!-- CARGA DE LOS 7 MÓDULOS JAVASCRIPT MODULARIZADOS -->
  <script src="./js/landing.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/pos.js"></script>
  <script src="./js/kardex.js"></script>
  <script src="./js/inventarioFisico.js"></script>
  <script src="./js/reportes.js"></script>
  <script src="./js/catalogos.js"></script>
</body>
</html>
